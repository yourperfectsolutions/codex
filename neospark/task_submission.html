<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeoSpark - Submit Task</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a href="home.html" class="logo">NeoSpark</a>
    <button class="nav-toggle" aria-label="Toggle navigation">Menu</button>
    <nav class="nav-links">
      <a href="home.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="task_submission.html">Submit Task</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Submit a Task</h1>
    <p>Configure permissions and details before assigning.</p>
  </section>
  <section class="task-form">
    <form>
      <label>
        Task Title
        <input type="text" name="title" required>
      </label>
      <label>
        Description
        <textarea name="description" rows="4" required></textarea>
      </label>
      <fieldset>
        <legend>Permissions</legend>
        <label><input type="checkbox" name="view" checked> Allow others to view</label>
        <label><input type="checkbox" name="edit"> Allow edits</label>
        <label><input type="checkbox" name="comment"> Allow comments</label>
        <label><input type="checkbox" name="reassign"> Allow reassignment</label>
      </fieldset>
      <button type="submit" class="primary">Submit Task</button>
    </form>
  </section>
  <script>
    const toggleBtn = document.querySelector('.nav-toggle');
    const navLinks = document.querySelector('.nav-links');
    toggleBtn.addEventListener('click', () => {
      navLinks.classList.toggle('active');
    });
  </script>
</body>
</html>
