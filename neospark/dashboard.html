<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeoSpark - Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <h1>NeoSpark Dashboard</h1>
    <p>Key operational metrics at a glance.</p>
  </header>
  <section class="dashboard">
    <div class="metric-card">
      <h2>Active Tasks</h2>
      <p class="metric">12</p>
    </div>
    <div class="metric-card">
      <h2>Completed Tasks</h2>
      <p class="metric">87</p>
    </div>
    <div class="metric-card">
      <h2>Resource Usage</h2>
      <p class="metric">65%</p>
    </div>
  </section>
</body>
</html>
